<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detection • NLP</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f3f6fb; color: #15233e; margin: 0; }
    .header { background: #14315d; color: white; padding: 21px 0; }
    .wrap { width: min(920px, calc(100% - 48px)); margin: auto; }
    .brand { font-size: 15px; letter-spacing: 2.1px; font-weight: 700; opacity: .86; }
    main { margin: 48px auto; }
    .card { background: white; border-radius: 17px; box-shadow: 0 12px 42px rgba(26,46,82,.10); padding: 38px 42px; }
    h1 { font-size: 32px; margin: 0 0 12px; letter-spacing: -.7px; }
    .sub { margin: 0 0 29px; color: #52627b; line-height: 1.6; }
    label { display: block; font-size: 15px; font-weight: 650; margin-bottom: 11px; }
    textarea { width: 100%; min-height: 114px; padding: 17px; border: 1px solid #c7d3e2; border-radius: 10px; font: inherit; font-size: 17px; color: #16223c; resize: vertical; }
    textarea:focus { outline: 3px solid #bbd6ff; border-color: #397dd4; }
    button { margin-top: 19px; border: 0; background: #2259a4; color: white; font-size: 16px; font-weight: 650; border-radius: 10px; padding: 14px 24px; cursor: pointer; }
    button:hover { background: #184781; }
    .result { margin-top: 35px; border-top: 1px solid #e0e6f0; padding-top: 28px; }
    h2 { font-size: 21px; margin: 0 0 15px; }
    #system_response { border-radius: 9px; background: #f5f8fe; border: 1px solid #dbe7fb; padding: 19px 21px; min-height: 64px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    #system_response.error { background: #fff5f3; border-color: #f2c6bc; color: #a12d1e; }
    .note { margin-top: 17px; font-size: 13px; line-height: 1.6; color: #697995; }
  </style>
  <script defer src="/static/mywebscript.js"></script>
</head>
<body>
  <header class="header"><div class="wrap brand">NLP / EMOTION DETECTION</div></header>
  <main class="wrap">
    <section class="card">
      <h1>Emotion Detection</h1>
      <p class="sub">Enter a sentence below to identify its most prominent emotion.</p>
      <form id="emotionForm">
        <label for="textToAnalyze">Text to analyze</label>
        <textarea id="textToAnalyze" placeholder="For example: I am very happy about this!" aria-label="Text to analyze"></textarea>
        <button type="submit" id="analyzeButton">Analyze emotion</button>
      </form>
      <section class="result">
        <h2>Emotion detection result</h2>
        <div id="system_response" role="status" aria-live="polite">Your analysis will appear here.</div>
        <p class="note">Scores come from Watson NLP when available. During a service outage, an approximate keyword-based estimate is used.</p>
      </section>
    </section>
  </main>
</body>
</html>
