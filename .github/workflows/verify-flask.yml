name: Verify Flask deployment and static analysis

on:
  push:
    branches: [main]
    paths:
      - server.py
      - emotion_detection.py
      - EmotionDetection/**
      - static/**
      - templates/**
      - scripts/capture_deployment.py
      - requirements.txt
      - .github/workflows/verify-flask.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt playwright
      - name: Test five emotion categories
        run: python3 test_emotion_detection.py
      - name: Run Pylint and capture real score
        shell: bash
        run: |
          set -o pipefail
          printf '$ cd /home/project/final_project\n$ pylint server.py\n' > 8b_static_code_analysis
          pylint server.py 2>&1 | tee -a 8b_static_code_analysis
      - name: Test web routes and capture real Chrome screenshots
        shell: bash
        env:
          EMOTION_OFFLINE_ONLY: '1'
        run: |
          python3 server.py > /tmp/flask-web.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -sf http://127.0.0.1:5000/ > /dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          from server import app
          client = app.test_client()
          ok = client.get('/emotionDetector?textToAnalyze=I%20am%20very%20angry')
          assert ok.status_code == 200, (ok.status_code, ok.get_data(as_text=True))
          assert 'dominant emotion is anger.' in ok.get_data(as_text=True)
          bad = client.get('/emotionDetector?textToAnalyze=')
          assert bad.status_code == 400, bad.status_code
          assert 'Invalid text! Please try again!' in bad.get_data(as_text=True)
          print('Flask route tests: passed')
          PY
          python3 scripts/capture_deployment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Task-6-to-8-evidence
          path: |
            6b_deployment_test.png
            7c_error_handling_interface.png
            8b_static_code_analysis
          if-no-files-found: ignore
      - name: Commit verified screenshot and Pylint evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6b_deployment_test.png 7c_error_handling_interface.png 8b_static_code_analysis
          git commit -m "Save verified Flask screenshots and pylint result [skip ci]"
          git push
